<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ring{transform-origin:32px 32px;animation:spin 7s linear infinite}
    .dot{transform-origin:50px 14px;animation:pulse 1.8s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
    @media (prefers-reduced-motion:reduce){.ring,.dot{animation:none}}
  </style>
  <rect width="64" height="64" rx="14" fill="#f4f1eb"/>
  <g fill="none" stroke="#171717" stroke-linecap="round">
    <circle cx="32" cy="32" r="25" stroke-width="1.4" opacity=".16"/>
    <path class="ring" d="M32 7a25 25 0 0 1 24 18" stroke-width="2.6"/>
  </g>
  <text x="32" y="39" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="25" font-weight="700" letter-spacing="-2" fill="#171717">PS</text>
  <circle class="dot" cx="50" cy="14" r="2.2" fill="#171717"/>
</svg>